<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" role="img" aria-labelledby="title description">
  <title id="title">JDoor Assist — consent-based remote support</title>
  <desc id="description">A project and source tour built around explicit approval, visible session limits and an immediate stop path.</desc>
  <rect width="600" height="230" rx="18" fill="#0e1111" />
  <g opacity=".1" stroke="#f4f1ea">
    <path d="M0 46h600M0 92h600M0 138h600M0 184h600" />
    <path d="M60 0v230M120 0v230M180 0v230M240 0v230M300 0v230M360 0v230M420 0v230M480 0v230M540 0v230" />
  </g>

  <text x="34" y="40" fill="#e97a4a" font-family="monospace" font-size="12" letter-spacing="2">07 / CONSENT-BASED SUPPORT</text>
  <text x="34" y="94" fill="#f4f1ea" font-family="Arial, sans-serif" font-size="38" font-weight="800">JDoor Assist</text>
  <text x="34" y="128" fill="#a5a8a6" font-family="monospace" font-size="11" letter-spacing="1">VISIBLE APPROVAL · IMMEDIATE STOP</text>
  <rect x="34" y="160" width="216" height="32" rx="6" fill="#e97a4a" />
  <text x="142" y="181" fill="#0e1111" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">SOURCE TOUR / PRE-RELEASE</text>

  <rect x="354" y="38" width="212" height="164" rx="12" fill="#171b1b" stroke="#e97a4a" />
  <text x="460" y="59" fill="#e97a4a" font-family="monospace" font-size="9" text-anchor="middle" letter-spacing="1">SESSION BOUNDARY</text>
  <path d="M395 117h38M487 117h38M460 88v58" fill="none" stroke="#f4f1ea" stroke-width="2" opacity=".6" />
  <rect x="375" y="101" width="40" height="32" rx="5" fill="#f4f1ea" />
  <rect x="440" y="72" width="40" height="32" rx="5" fill="#e97a4a" />
  <rect x="505" y="101" width="40" height="32" rx="5" fill="#f4f1ea" />
  <rect x="440" y="132" width="40" height="32" rx="5" fill="#0e1111" stroke="#e97a4a" />
  <text x="395" y="121" fill="#0e1111" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">ASK</text>
  <text x="460" y="92" fill="#0e1111" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">ALLOW</text>
  <text x="525" y="121" fill="#0e1111" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">VIEW</text>
  <text x="460" y="152" fill="#e97a4a" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">STOP</text>
  <text x="460" y="184" fill="#a5a8a6" font-family="monospace" font-size="9" text-anchor="middle" letter-spacing="1">NO UNATTENDED ACCESS</text>
</svg>
